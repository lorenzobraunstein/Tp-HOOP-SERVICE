<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Administradores</title>

    <link rel="icon" href="../img/logo.jpg" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header>
      <img
        src="../img/logo.jpg"
        alt="Logo de HOOP Service"
        width="50"
        height="50"
      />
      HOOP SERVICE
    </header>
    <nav id="navbar"></nav>

    <main class="bienvenida">
      <div class="bienvenida__card">
        <img
          src="../img/logo.jpg"
          alt="Logo de HOOP Service"
          width="120"
          height="120"
        />
        <h1 class="h3">Login de administradores</h1>
        <p class="text-body-secondary mb-0">
          Ingrese su email y contraseña para acceder.
        </p>

        <form id="form-bienvenida" class="w-100" novalidate>
          <div class="mb-3 text-start">
            <label for="email" class="form-label">Email</label>
            <input
              type="text"
              id="email"
              class="form-control"
              maxlength="30"
              required
            />
            <label for="password" class="form-label">Contraseña</label>
            <input
              type="password"
              id="password"
              class="form-control"
              maxlength="30"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100">Continuar</button>
        </form>
      </div>
    </main>

    <footer>Lorenzo Braunstein & Adrián López Da Silva</footer>

    <!-- Bootstrap JS (necesario para los modales) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Tus scripts -->
    <!--<script src="../js/layout.js"></script> -->
    <script src="../js/index.js"></script>
  </body>
</html>
