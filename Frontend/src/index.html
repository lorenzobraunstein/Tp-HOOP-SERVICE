<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOOP Service</title>
    <link rel="icon" href="../img/logo.jpg" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/styles.css" />

  </head>

  <body data-page="index">

    <nav class="navbar navbar-expand-md bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="./index.html">
          <img src="../img/logo.jpg" alt="Logo HOOP Service" width="40" height="40" class="rounded" />
          <span class="fw-semibold">HOOP SERVICE</span>
        </a>

        <div class="collapse navbar-collapse" id="nav-contenido">
          <div class="ms-auto d-flex align-items-center gap-2">
            <a href="./login.html" class="btn btn-outline-light btn-sm">Admin</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="bienvenida">
      <div class="bienvenida__card">
        <img src="../img/logo.jpg" alt="Logo de HOOP Service" width="120" height="120" />
        <h1 class="h3">¡Bienvenido a HOOP Service!</h1>
        <p class="h5">Zapatillas y camisetas de básquet.</p>
        <p class="text-body-secondary mb-0">Ingresá tu nombre para empezar.</p>

        <form id="form-bienvenida" class="w-100" novalidate>
          <div class="mb-3 text-start">
            <label for="nombre" class="form-label">Tu nombre</label>
            <input type="text" id="nombre" class="form-control" maxlength="30" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Continuar</button>
        </form>
      </div>
    </main>

    <footer class="bg-body-tertiary text-center py-3 border-top">
      <small class="text-body-secondary">
        Alumnos: Lorenzo Braunstein &amp; Adrián López Da Silva
      </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/index.js"></script>
  </body>
</html>
