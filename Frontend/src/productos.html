<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Productos</title>
    <link rel="icon" href="../img/logo.jpg" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body data-page="productos">
    <nav class="navbar navbar-expand-md bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="./index.html"
        >
          <img
            src="../img/logo.jpg"
            alt="Logo HOOP Service"
            width="40"
            height="40"
            class="rounded"
          />
          <span class="fw-semibold">HOOP SERVICE</span>
        </a>

        <div class="collapse navbar-collapse" id="nav-contenido">
          <ul
            class="navbar-nav position-absolute top-50 start-50 translate-middle"
          >
            <li class="nav-item">
              <a class="nav-link" href="./productos.html">Productos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./carrito.html">Carrito</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-4">
      <section class="productos">
        <p class="productos__saludo h5" id="saludo"></p>

        <div class="productos__categorias">
          <button id="btnTodo" type="button" class="btn btn-primary">
            Todo
          </button>
          <button id="btnZapatillas" type="button" class="btn btn-outline-dark">
            Zapatillas
          </button>
          <button id="btnCamisetas" type="button" class="btn btn-outline-dark">
            Camisetas
          </button>
        </div>

        <!-- Grilla de cards. Mas adelante, productos.js va a reemplazar
         estas cards hardcodeadas por las que vengan del backend. -->
        <div class="productos__lista" id="lista-productos"></div>

        <!-- Hueco para la paginacion (vacio por ahora) -->
        <nav
          class="productos__paginacion"
          aria-label="Paginacion de productos"
        ></nav>
      </section>
    </main>

    <footer class="bg-body-tertiary text-center py-3 border-top">
      <small class="text-body-secondary">
        Alumnos: Lorenzo Braunstein &amp; Adrián López Da Silva
      </small>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../js/layout.js"></script>
    <script src="..//js/productos.js"></script>
    <!-- productos.js lo armamos en el siguiente paso -->
  </body>
</html>
