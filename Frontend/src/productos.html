<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Productos</title>
    <link rel="icon" href="../img/logo.jpg" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body data-page="productos">
    <nav class="navbar navbar-expand-md bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="./index.html"
        >
          <img
            src="../img/logo.jpg"
            alt="Logo HOOP Service"
            width="40"
            height="40"
            class="rounded"
          />
          <span class="fw-semibold">HOOP SERVICE</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#nav-contenido"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav-contenido">
          <ul class="navbar-nav mx-auto nav-centrado">
            <li class="nav-item">
              <a class="nav-link" href="./productos.html">Productos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./carrito.html">Carrito</a>
            </li>
          </ul>

          <div class="ms-auto d-flex align-items-center gap-2">
          <button id="btn-tema" type="button" class="btn btn-outline-light btn-sm">
            🌙
          </button>
        </div>
      </div>
    </nav>

    <main class="container my-4">
      <section class="productos">
        <p class="productos__saludo h5" id="saludo"></p>

        <div class="productos__categorias">
          <button id="btnTodo" type="button" class="btn btn-outline-primary">
            Todo
          </button>
          <button id="btnZapatillas" type="button" class="btn btn-outline-primary">
            Zapatillas
          </button>
          <button id="btnCamisetas" type="button" class="btn btn-outline-primary">
            Camisetas
          </button>
        </div>

        <div class="productos__lista" id="lista-productos"></div>

        <nav class="productos__paginacion" id="paginacion"></nav>
      </section>
    </main>

    <footer class="bg-body-tertiary text-center py-3 border-top">
      <small class="text-body-secondary">
        Alumnos: Lorenzo Braunstein &amp; Adrián López Da Silva
      </small>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../js/layout.js"></script>
    <script src="../js/productos.js"></script>
  </body>
</html>
