<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carrito</title>
    <link rel="icon" href="../img/logo.jpg" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body data-page="carrito">
    <nav class="navbar navbar-expand-md bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="./index.html"
        >
          <img
            src="../img/logo.jpg"
            alt="Logo HOOP Service"
            width="40"
            height="40"
            class="rounded"
          />
          <span class="fw-semibold">HOOP SERVICE</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#nav-contenido"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav-contenido">
          <ul class="navbar-nav mx-auto nav-centrado">
            <li class="nav-item">
              <a class="nav-link" href="./productos.html">Productos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./carrito.html">Carrito</a>
            </li>
          </ul>

          <!-- ms-auto lo manda a la derecha. Hace falta porque el
               <ul> está absoluto y ya no lo empuja. -->
          <button
            id="btn-tema"
            type="button"
            class="btn btn-outline-light btn-sm ms-auto"
          >
            🌙
          </button>
        </div>
      </div>
    </nav>

    <main class="container my-4">
      <section class="carrito">
        <h1 class="carrito__titulo h3">Tu carrito</h1>

        <!-- Las filas las llena carrito.js -->
        <div class="carrito__items" id="lista__carrito"></div>

        <!-- Resumen: a la derecha en desktop, abajo en mobile -->
        <aside class="carrito__resumen">
          <div class="d-flex justify-content-between">
            <span>Total</span>
            <strong id="carrito-total">$0</strong>
          </div>
          <a href="./productos.html" class="btn btn-outline-primary">
            Seguir comprando
          </a>
          <a href="./ticket.html" id="btn-finalizar" class="btn btn-primary">
            Finalizar compra
          </a>
        </aside>
      </section>
    </main>

    <footer class="bg-body-tertiary text-center py-3 border-top">
      <small class="text-body-secondary">
        Alumnos: Lorenzo Braunstein &amp; Adrián López Da Silva
      </small>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../js/layout.js"></script>
    <script src="../js/carrito.js"></script>
  </body>
</html>
